{% extends 'base.html' %}
{% block content %}
<h1>Confirm Booking</h1>
<div class="card" style="max-width:500px;">
    <p><strong>Doctor:</strong> Dr. {{ slot.doctor.name }}</p>
    <p><strong>Date:</strong> {{ slot.date }}</p>
    <p><strong>Time:</strong> {{ slot.start_time }} – {{ slot.end_time }}</p>
    <br>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-green">Confirm booking</button>
        <a href="{% url 'available_slots' slot.doctor.id %}" class="btn btn-gray" style="margin-left:0.5rem">Go back</a>
    </form>
</div>
{% endblock %}
