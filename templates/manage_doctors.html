{% extends 'base.html' %}
{% block content %}
<h1>Manage Doctors</h1>
<a href="{% url 'add_doctor' %}" class="btn btn-green" style="margin-bottom:1rem;">Add doctor</a>
<div class="card">
    <table>
        <tr><th>Name</th><th>Specialisation</th><th>Available days</th><th></th></tr>
        {% for doctor in doctors %}
        <tr>
            <td>Dr. {{ doctor.name }}</td>
            <td>{{ doctor.specialisation }}</td>
            <td>{{ doctor.available_days }}</td>
            <td>
                <a href="{% url 'edit_doctor' doctor.id %}" class="btn btn-gray">Edit</a>
                <form method="post" action="{% url 'delete_doctor' doctor.id %}" style="display:inline;">
                    {% csrf_token %}
                    <button class="btn btn-red" onclick="return confirm('Delete this doctor?')">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No doctors added yet.</td></tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
