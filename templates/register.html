{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:480px; margin:auto;">
    <h2>Create an account</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p style="color:red;font-size:0.85rem;">{{ field.errors.0 }}</p>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-green">Register</button>
        <a href="{% url 'login' %}" class="btn btn-gray" style="margin-left:0.5rem">Login instead</a>
    </form>
</div>
{% endblock %}
