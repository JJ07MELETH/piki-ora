{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:400px; margin:auto;">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-green">Login</button>
        <a href="{% url 'register' %}" class="btn btn-gray" style="margin-left:0.5rem">Register instead</a>
    </form>
</div>
{% endblock %}
